<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#e8a33d"/>
    </marker>
  </defs>

  <rect width="900" height="1000" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#111">Light_sensor &#8212; densit&#244;metro de transmit&#226;ncia + datalogger</text>
  <text x="40" y="64" font-size="12.5" fill="#666">ESP32 &#183; TSL2591 &#183; DS3231 &#183; DS18B20 &#183; microSD &#183; LED IR 850 nm &#8212; JUST Lab, DEBIQ EEL-USP</text>

  <!-- ================= PAINEL 1 : LIGACOES ================= -->
  <rect x="40" y="86" width="820" height="494" rx="8" fill="#fbfbfb" stroke="#e0e0e0"/>
  <text x="58" y="110" font-size="14" font-weight="bold" fill="#333">1 &#183; Liga&#231;&#245;es</text>

  <!-- ESP32 -->
  <rect x="60" y="150" width="172" height="360" rx="6" fill="#e8eef7" stroke="#2b4a73" stroke-width="1.5"/>
  <text x="146" y="178" font-size="14" font-weight="bold" fill="#2b4a73" text-anchor="middle">ESP32</text>
  <text x="146" y="195" font-size="11" fill="#2b4a73" text-anchor="middle">DevKit V1</text>
  <text x="146" y="214" font-size="10" fill="#5a7296" text-anchor="middle">alimentado por USB</text>
  <line x1="76" y1="228" x2="216" y2="228" stroke="#bcc9db"/>

  <text x="222" y="246" font-size="11" font-weight="bold" fill="#1d6fb8" text-anchor="end">D21 &#183; D22</text>
  <text x="222" y="261" font-size="9.5" fill="#6a89a8" text-anchor="end">SDA &#183; SCL</text>

  <text x="222" y="334" font-size="11" font-weight="bold" fill="#c2691a" text-anchor="end">D18 &#183; D19 &#183; D23 &#183; D5</text>
  <text x="222" y="349" font-size="9.5" fill="#b08a62" text-anchor="end">SCK &#183; MISO &#183; MOSI &#183; CS</text>

  <text x="222" y="419" font-size="11" font-weight="bold" fill="#17807a" text-anchor="end">D4</text>
  <text x="222" y="434" font-size="9.5" fill="#6aa5a1" text-anchor="end">1-Wire</text>

  <text x="222" y="494" font-size="11" font-weight="bold" fill="#7b2cbf" text-anchor="end">D26</text>

  <!-- barramento I2C -->
  <line x1="232" y1="242" x2="470" y2="242" stroke="#1d6fb8" stroke-width="3"/>
  <line x1="470" y1="182" x2="470" y2="258" stroke="#1d6fb8" stroke-width="3"/>
  <line x1="470" y1="182" x2="520" y2="182" stroke="#1d6fb8" stroke-width="3"/>
  <line x1="470" y1="258" x2="520" y2="258" stroke="#1d6fb8" stroke-width="3"/>
  <circle cx="470" cy="242" r="4" fill="#1d6fb8"/>
  <text x="350" y="234" font-size="10" fill="#1d6fb8" text-anchor="middle">barramento I2C &#8212; dois dispositivos, sem conflito</text>

  <!-- SPI -->
  <line x1="232" y1="338" x2="520" y2="338" stroke="#c2691a" stroke-width="3"/>
  <text x="376" y="330" font-size="10" fill="#c2691a" text-anchor="middle">SPI</text>

  <!-- 1-Wire -->
  <line x1="232" y1="423" x2="520" y2="423" stroke="#17807a" stroke-width="3"/>
  <text x="376" y="415" font-size="10" fill="#17807a" text-anchor="middle">1-Wire</text>

  <!-- LED -->
  <line x1="232" y1="490" x2="300" y2="490" stroke="#7b2cbf" stroke-width="3"/>
  <rect x="300" y="481" width="58" height="18" fill="#ffffff" stroke="#7b2cbf" stroke-width="2"/>
  <text x="329" y="474" font-size="9.5" fill="#7b2cbf" text-anchor="middle">150 &#8486;</text>
  <line x1="358" y1="490" x2="520" y2="490" stroke="#7b2cbf" stroke-width="3"/>

  <!-- perifericos -->
  <rect x="520" y="152" width="340" height="60" rx="5" fill="#eef7e8" stroke="#3b6b2b" stroke-width="1.5"/>
  <text x="534" y="173" font-size="12.5" font-weight="bold" fill="#3b6b2b">TSL2591 &#8212; luz transmitida</text>
  <text x="534" y="190" font-size="9.5" fill="#4a6b40">I2C 0x29 (fixo)</text>
  <text x="534" y="204" font-size="9.5" fill="#333">VIN&#8594;3V3 &#183; GND&#8594;GND &#183; SDA&#8594;D21 &#183; SCL&#8594;D22</text>

  <rect x="520" y="228" width="340" height="60" rx="5" fill="#eef7e8" stroke="#3b6b2b" stroke-width="1.5"/>
  <text x="534" y="249" font-size="12.5" font-weight="bold" fill="#3b6b2b">DS3231 &#8212; rel&#243;gio</text>
  <text x="534" y="266" font-size="9.5" fill="#4a6b40">I2C 0x68 &#183; precisa da CR2032</text>
  <text x="534" y="280" font-size="9.5" fill="#333">VCC&#8594;3V3 &#183; GND&#8594;GND &#183; SDA&#8594;D21 &#183; SCL&#8594;D22</text>

  <rect x="520" y="304" width="340" height="72" rx="5" fill="#fdf3e8" stroke="#c2691a" stroke-width="1.5"/>
  <text x="534" y="325" font-size="12.5" font-weight="bold" fill="#c2691a">microSD &#8212; registro</text>
  <text x="534" y="342" font-size="9.5" fill="#333">SCK&#8594;D18 &#183; MISO&#8594;D19 &#183; MOSI&#8594;D23 &#183; CS&#8594;D5</text>
  <text x="534" y="357" font-size="9.5" fill="#333">GND&#8594;GND</text>
  <text x="534" y="371" font-size="9.5" font-weight="bold" fill="#a8451a">VCC&#8594;3V3 &#8212; placa sem regulador. NUNCA em VIN (5 V).</text>

  <rect x="520" y="392" width="340" height="62" rx="5" fill="#e8f6f5" stroke="#17807a" stroke-width="1.5"/>
  <text x="534" y="413" font-size="12.5" font-weight="bold" fill="#17807a">DS18B20 &#8212; temperatura da cultura</text>
  <text x="534" y="430" font-size="9.5" fill="#333">vermelho&#8594;3V3 &#183; preto&#8594;GND &#183; amarelo&#8594;D4</text>
  <text x="534" y="445" font-size="9.5" font-weight="bold" fill="#0f5c58">+ resistor de 4,7 k&#8486; entre D4 e 3V3 (obrigat&#243;rio)</text>

  <rect x="520" y="468" width="340" height="44" rx="5" fill="#f4ecfb" stroke="#7b2cbf" stroke-width="1.5"/>
  <text x="534" y="488" font-size="12.5" font-weight="bold" fill="#7b2cbf">LED IR 850 nm &#8212; emissor</text>
  <text x="534" y="504" font-size="9.5" fill="#333">&#226;nodo (perna longa) &#8592; resistor &#183; c&#225;todo&#8594;GND &#183; ~13 mA</text>

  <!-- aviso SD -->
  <rect x="60" y="528" width="800" height="38" rx="5" fill="#fff6e0" stroke="#d9a441"/>
  <text x="74" y="545" font-size="10.5" font-weight="bold" fill="#8a5a00">Tudo neste circuito &#233; 3,3 V. Nada vai no pino VIN.</text>
  <text x="74" y="559" font-size="10.5" fill="#6b4a10">Se a grava&#231;&#227;o no cart&#227;o falhar de forma intermitente, solde 100 &#181;F entre VCC e GND do m&#243;dulo de SD, o mais perto poss&#237;vel dele.</text>

  <!-- ================= PAINEL 2 : OPTICA ================= -->
  <rect x="40" y="600" width="820" height="380" rx="8" fill="#fbfbfb" stroke="#e0e0e0"/>
  <text x="58" y="624" font-size="14" font-weight="bold" fill="#333">2 &#183; Geometria &#243;ptica &#8212; corte da luva impressa</text>

  <circle cx="225" cy="800" r="105" fill="#2b2b2b"/>
  <circle cx="225" cy="800" r="80" fill="#ffffff" stroke="#9aa5ad" stroke-width="3"/>
  <circle cx="225" cy="800" r="70" fill="#b7e0b0"/>

  <rect x="118" y="789" width="30" height="22" fill="#fff6c9"/>
  <polygon points="96,790 96,810 116,800" fill="#7b2cbf"/>
  <text x="88" y="840" font-size="10" fill="#7b2cbf" text-anchor="middle">LED IR</text>

  <line x1="150" y1="800" x2="294" y2="800" stroke="#e8a33d" stroke-width="3" marker-end="url(#seta)"/>
  <text x="228" y="790" font-size="10" fill="#8a6414" text-anchor="middle">caminho &#243;ptico = DI do tubo</text>

  <rect x="296" y="773" width="34" height="54" rx="3" fill="#cfe3f5" stroke="#1d6fb8" stroke-width="2"/>
  <text x="340" y="856" font-size="10" fill="#1d6fb8" text-anchor="middle">TSL2591</text>

  <text x="225" y="876" font-size="10" fill="#2f5c2a" text-anchor="middle">cultura</text>
  <text x="225" y="930" font-size="10.5" fill="#444" text-anchor="middle">luva impressa preta &#8212; veda a luz das barras do Light_control</text>

  <text x="400" y="664" font-size="13" font-weight="bold" fill="#333">A medida</text>
  <text x="400" y="688" font-size="12" fill="#333">I0 = leitura com meio limpo (o branco)</text>
  <text x="400" y="709" font-size="12" fill="#333">I&#160; = leitura com cultura</text>
  <rect x="398" y="722" width="238" height="36" rx="4" fill="#f2f2ea" stroke="#c9c9b8"/>
  <text x="412" y="747" font-size="15" font-weight="bold" fill="#111">OD = log10( I0 / I )</text>
  <text x="400" y="780" font-size="12" fill="#333">%T = 100 &#215; I / I0</text>

  <text x="400" y="816" font-size="13" font-weight="bold" fill="#333">Toda medida &#233; dupla</text>
  <text x="400" y="838" font-size="11.5" fill="#444">1. LED aceso &#8594; uma integra&#231;&#227;o completa</text>
  <text x="400" y="856" font-size="11.5" fill="#444">2. LED apagado &#8594; outra integra&#231;&#227;o</text>
  <text x="400" y="874" font-size="11.5" fill="#444">3. sinal = aceso &#8722; apagado</text>
  <text x="400" y="898" font-size="11.5" fill="#666">A subtra&#231;&#227;o elimina a luz ambiente que vaza e a corrente</text>
  <text x="400" y="914" font-size="11.5" fill="#666">de escuro. &#201; o que permite medir OD com as barras do</text>
  <text x="400" y="930" font-size="11.5" fill="#666">Light_control acesas do lado.</text>
</svg>
