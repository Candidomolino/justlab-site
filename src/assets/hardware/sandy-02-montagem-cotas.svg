  <polyline points="421,165 418,300 414,411 412,470 399,527" fill="none" stroke="#333" stroke-width="2"/>
  <g fill="#fff" stroke="#333" stroke-width="2">
    <circle cx="412" cy="411" r="4.5"/><circle cx="396" cy="435" r="5.5"/><circle cx="414" cy="456" r="4.5"/>
    <circle cx="401" cy="485" r="5.5"/><circle cx="405" cy="511" r="5"/><circle cx="399" cy="527" r="4.5"/>
  </g>

