<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" font-family="Arial, Helvetica, sans-serif" fill="#222">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#333"/>
    </marker>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e36c"/>
      <stop offset="1" stop-color="#5fa524"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="840" fill="#fff"/>

  <text x="35" y="42" font-size="24" font-weight="700">(a) Front view — SANDY v2, rigid LED-bar lighting</text>
  <text x="996" y="42" font-size="24" font-weight="700">(b) Top plate, plan view</text>

  <!-- legs, crossbar, feet -->
  <rect x="224" y="190" width="28" height="532" fill="#e8e6d9" stroke="#444" stroke-width="2"/>
  <rect x="565" y="190" width="28" height="532" fill="#e8e6d9" stroke="#444" stroke-width="2"/>
  <rect x="213" y="722" width="49" height="23" rx="4" fill="#e8e6d9" stroke="#444" stroke-width="2"/>
  <rect x="555" y="722" width="49" height="23" rx="4" fill="#e8e6d9" stroke="#444" stroke-width="2"/>
  <rect x="252" y="667" width="313" height="16" fill="#e8e6d9" stroke="#444" stroke-width="2"/>

  <!-- bag -->
  <path d="M357 163 L461 163 L486 392 L492 525 Q492 547 470 547 L348 547 Q326 547 326 525 L331 392 Z" fill="#e6f2fb" stroke="#3b82b4" stroke-width="2.5"/>
  <path d="M331 392 L486 392 L492 525 Q492 547 470 547 L348 547 Q326 547 326 525 Z" fill="url(#liq)"/>

  <!-- top plate and clamping ring (drawn over the bag mouth) -->
  <rect x="355" y="130" width="107" height="22" fill="#fff" stroke="#444" stroke-width="2"/>
  <rect x="214" y="151" width="391" height="40" rx="4" fill="#f4f4ee" stroke="#444" stroke-width="2"/>
  <ellipse cx="408" cy="150" rx="60" ry="12" fill="#8fd14f" stroke="#444" stroke-width="2"/>

