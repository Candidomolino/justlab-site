  <g stroke="#444" stroke-width="2" fill="#f5c518">
    <rect x="258" y="292" width="20" height="270" rx="3"/>
    <rect x="541" y="292" width="20" height="270" rx="3"/>
  </g>
  <g fill="#fff" stroke="#8a6d00" stroke-width="1">
    <rect x="264" y="304" width="9" height="9"/><rect x="264" y="338" width="9" height="9"/><rect x="264" y="372" width="9" height="9"/>
    <rect x="264" y="406" width="9" height="9"/><rect x="264" y="440" width="9" height="9"/><rect x="264" y="474" width="9" height="9"/>
    <rect x="264" y="508" width="9" height="9"/><rect x="264" y="542" width="9" height="9"/>
    <rect x="547" y="304" width="9" height="9"/><rect x="547" y="338" width="9" height="9"/><rect x="547" y="372" width="9" height="9"/>
    <rect x="547" y="406" width="9" height="9"/><rect x="547" y="440" width="9" height="9"/><rect x="547" y="474" width="9" height="9"/>
    <rect x="547" y="508" width="9" height="9"/><rect x="547" y="542" width="9" height="9"/>
  </g>
  <g stroke="#888" stroke-width="1.5">
    <line x1="278" y1="346" x2="328" y2="346"/><line x1="278" y1="426" x2="332" y2="426"/><line x1="278" y1="507" x2="326" y2="507"/>
    <line x1="490" y1="346" x2="541" y2="346"/><line x1="490" y1="426" x2="541" y2="426"/><line x1="492" y1="507" x2="541" y2="507"/>
  </g>

  <!-- dimensions, front view -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="140" y1="135" x2="140" y2="745" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="185" y1="292" x2="185" y2="562" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="238" y1="777" x2="580" y2="777" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <text transform="translate(106 440) rotate(-90)" font-size="20" fill="#555">H_total</text>
  <text transform="translate(167 430) rotate(-90)" font-size="20" fill="#555">L_LED</text>
  <text x="408" y="808" font-size="21" text-anchor="middle" fill="#333">175 mm (leg axes)</text>

  <!-- labels, front view -->
  <g font-size="21" fill="#333">
    <text x="626" y="136">bag clamping ring (Ø95 mm inner)</text>
    <text x="626" y="162">3D-printed top plate</text>
    <text x="626" y="188">220 × 220 × 45 mm</text>
    <text x="626" y="346">4 rigid LED bars (SMD 4014, 24 V DC),</text>
    <text x="626" y="372">facing the central axis</text>
    <text x="626" y="473">HDPE bag, working volume 1–2 L</text>
    <text x="626" y="523">sparger (silicone tube)</text>
    <text x="626" y="665">PVC tube legs (Ø30 mm)</text>
  </g>

  <!-- plan view -->
  <rect x="1031" y="107" width="426" height="426" rx="10" fill="#f2f2ec" stroke="#444" stroke-width="2"/>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <line x1="1077" y1="153" x2="1411" y2="153"/><line x1="1077" y1="488" x2="1411" y2="488"/>
    <line x1="1411" y1="153" x2="1411" y2="488"/>
    <line x1="1077" y1="153" x2="1077" y2="488" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g fill="#e3e0d1" stroke="#444" stroke-width="2">
    <circle cx="1077" cy="153" r="44"/><circle cx="1411" cy="153" r="44"/>
    <circle cx="1077" cy="488" r="44"/><circle cx="1411" cy="488" r="44"/>
  </g>
  <g fill="#fff" stroke="#444" stroke-width="1.5">
    <circle cx="1077" cy="153" r="30"/><circle cx="1411" cy="153" r="30"/>
    <circle cx="1077" cy="488" r="30"/><circle cx="1411" cy="488" r="30"/>
  </g>
  <g fill="#f5c518" stroke="#8a6d00" stroke-width="1.5">
    <rect x="1115" y="146" width="14" height="14"/><rect x="1359" y="146" width="14" height="14"/>
    <rect x="1115" y="481" width="14" height="14"/><rect x="1359" y="481" width="14" height="14"/>
  </g>
  <circle cx="1244" cy="320" r="112" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <circle cx="1244" cy="320" r="92" fill="#e8f3fb" stroke="#3b82b4" stroke-width="2"/>
  <line x1="1133" y1="320" x2="1355" y2="320" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1244" y="308" font-size="21" text-anchor="middle" fill="#333">Ø95</text>
  <text transform="translate(1046 330) rotate(-90)" font-size="20" fill="#333">175</text>
  <line x1="1497" y1="103" x2="1497" y2="533" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1512" y="326" font-size="21" fill="#333">220</text>
  <line x1="1031" y1="572" x2="1457" y2="572" stroke="#333" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1244" y="598" font-size="21" text-anchor="middle" fill="#333">220 mm</text>
  <g font-size="20" fill="#333">
    <text x="1031" y="638">Leg sockets Ø30 mm · M4 holes in the crossbars</text>
    <text x="1031" y="664">LED bars on clips attached to the legs (yellow)</text>
  </g>
</svg>
