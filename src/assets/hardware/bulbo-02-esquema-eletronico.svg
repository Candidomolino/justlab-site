<text class="t xs"  x="164" y="806">0x29  ·  ALONE on this bus</text>
<text class="t xs" x="462" y="788">The TSL2591 address is</text>
<text class="t xs" x="462" y="802">FIXED at 0x29. Two of</text>
<text class="t xs" x="462" y="816">them cannot share a bus.</text>
<line class="i2cb" x1="618" y1="604" x2="660" y2="604" stroke-dasharray="7 3"/>
