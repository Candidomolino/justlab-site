<!-- strapping note -->
<text class="t xs" x="664" y="872">Avoided: GPIO 0, 12, 15 (strapping) · 6–11 (flash).  GPIO5 is a strapping pin but idles HIGH as a CS — fine.</text>
<text class="t xs" x="1150" y="884">Buses are drawn. Point-to-point nets (CS, PWM, pumps, button, LED) are connected by matching labels at both ends.</text>

