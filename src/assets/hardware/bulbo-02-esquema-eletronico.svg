<!-- ============ ACTUATORS ============ -->
<text class="t sec" x="1150" y="508">ACTUATORS  —  low-side IRLZ44N, flyback diode on every inductive load</text>

<rect class="pwm" x="1150" y="524" width="430" height="64" rx="3"/>
<text class="t lbl" x="1162" y="545">LED 730 nm + LED 850 nm  ·  GPIO25 / GPIO26</text>
<text class="t xs"  x="1162" y="563">constant-current drivers · read SEQUENTIALLY, never together</text>
<text class="t xs"  x="1162" y="579">dark → 730 → dark → 850, each ratioed to the reference detector</text>

<rect class="pwm" x="1150" y="602" width="430" height="78" rx="3"/>
<text class="t lbl" x="1162" y="623">Stirrer — 80 mm 4-pin PWM fan, dual ball bearing</text>
<text class="t xs"  x="1162" y="641">GPIO27 → PWM in, 25 kHz  ·  GPIO35 ← TACH, 2 pulses/rev</text>
<text class="t xs"  x="1162" y="657">PI loop closes on RPM, not on duty cycle</text>
<text class="t xs"  x="1162" y="673">2 × N42 10×3 mm magnets on the hub, ≤10 mm to the liquid</text>

<rect class="pwm" x="1150" y="694" width="430" height="46" rx="3"/>
<text class="t lbl" x="1162" y="714">Circulation pump — 12 V peristaltic · GPIO32</text>
<text class="t xs"  x="1162" y="731">continuous but SLOW, 15–30 mL/min (τ ≈ 5–10 min)</text>

<rect class="ph2" x="1150" y="754" width="430" height="46" rx="3"/>
<text class="t lbl" x="1162" y="774">Dosing pumps — acid / base · GPIO33 / GPIO13</text>
<text class="t xs"  x="1162" y="791">PHASE 7 — wired and connectorised, NOT populated in v1</text>

<rect class="pwm" x="1150" y="814" width="430" height="46" rx="3"/>
<text class="t lbl" x="1162" y="834">Event button GPIO14 · Status LED GPIO2</text>
<text class="t xs"  x="1162" y="851">button to GND, internal pull-up, 300 ms debounce in firmware</text>

<!-- ============ ANALOG FRONT END ============ -->
<text class="t sec" x="34" y="892">ANALOG FRONT END  —  the subsystem that decides whether BULBO beats its ancestor</text>
<rect class="ana" x="34" y="904" width="620" height="236" rx="3"/>

<rect class="pwr" x="50" y="922" width="150" height="44" rx="3"/>
<text class="t lbl" x="125" y="941" text-anchor="middle">pH board, 5 V</text>
<text class="t xs"  x="125" y="957" text-anchor="middle">BNC → 0–5 V out</text>

<line class="w" x1="200" y1="944" x2="250" y2="944"/>
<rect class="ana" x="250" y="922" width="160" height="44" rx="3"/>
<text class="t lbl" x="330" y="941" text-anchor="middle">2:1 divider</text>
<text class="t xs"  x="330" y="957" text-anchor="middle">two 10 k → 0–2.5 V</text>

<line class="w" x1="410" y1="944" x2="460" y2="944"/>
<rect class="ana" x="460" y="922" width="170" height="44" rx="3"/>
<text class="t lbl" x="545" y="941" text-anchor="middle">ADS1115 A0</text>
<text class="t xs"  x="545" y="957" text-anchor="middle">3V3 · ±4.096 V FSR</text>

<text class="t xs" x="50" y="988">The divider keeps the entire I2C bus at 3V3 and removes the 5 V→3V3 level shifter Marchesan needed. Calibrate AFTER the divider.</text>

<!-- solution ground -->
<rect class="warn" x="50" y="1000" width="588" height="128" rx="3"/>
<text class="t sec" x="62" y="1021">SOLUTION GROUND  —  one wire, and the cheapest fix in the project</text>
<text class="t lbl" x="62" y="1044">Bond the stainless thermowell (already immersed) to the pH circuit ANALOG GROUND.</text>
<text class="t xs"  x="62" y="1064">Marchesan's reactor ended with a persistent 0.5 pH offset he never explained. The RAIO criterion is ±0.1.</text>
<text class="t xs"  x="62" y="1080">If the cause is electrostatic build-up — the PI's hypothesis — this is exactly the fix it predicts.</text>
<text class="t xs"  x="62" y="1100">Fit the lug on the thermowell at fabrication. Shielded electrode cable, shield grounded at ONE end only.</text>
<text class="t xs"  x="62" y="1118">Which mitigation actually matters is settled by the 2×2 experiment in build plan §2.3, not by guessing.</text>

<!-- ============ CAUTIONS ============ -->
<text class="t sec" x="690" y="912">CAUTIONS  —  found while drawing this schematic</text>
<rect class="warn" x="690" y="924" width="976" height="216" rx="3"/>

<text class="t lbl" x="706" y="950">1 ·  GPIO35 has NO internal pull-up.</text>
<text class="t xs"  x="706" y="968">GPIO 34–39 are input-only and have no internal pull-up or pull-down. The fan tach is an open-collector output,</text>
<text class="t xs"  x="706" y="984">so it needs an EXTERNAL 10 k pull-up to 3V3 — never to 5 V, the ESP32 is not 5 V tolerant.</text>
<text class="t xs"  x="706" y="1000">Fixed in firmware: pinMode(PIN_STIR_TACH, INPUT), not INPUT_PULLUP.</text>

<text class="t lbl" x="706" y="1030">2 ·  GPIO16 / GPIO17 do not exist on an ESP32-WROVER.</text>
<text class="t xs"  x="706" y="1048">They are consumed by PSRAM on WROVER modules. This design assumes WROOM-32. On a WROVER, move I2C bus 1</text>
<text class="t xs"  x="706" y="1064">to a free pair — and check the module marking before soldering, because both boards look identical.</text>

<text class="t lbl" x="706" y="1094">3 ·  The DS3231 module will try to charge a non-rechargeable cell.</text>
<text class="t xs"  x="706" y="1112">The common ZS-042 board has a trickle-charge circuit wired to the holder, intended for a rechargeable LIR2032.</text>
<text class="t xs"  x="706" y="1128">Either fit a LIR2032, or remove the charging resistor/diode and fit a CR2032. Check the board on arrival.</text>

<!-- ============ CAMERA NODE ============ -->
<text class="t sec" x="1130" y="138">CAMERA NODE  —  separate board</text>
<rect class="mcu" x="1130" y="150" width="536" height="124" rx="4"/>
<text class="t lbl" x="1146" y="172">XIAO ESP32S3 Sense  —  Matchboxscope / ESPressoscope</text>
<text class="t xs"  x="1146" y="192">Camera (OV2640) and microSD are on-board and consume nearly all pins —</text>
<text class="t xs"  x="1146" y="208">which is why the chamber sensors cannot share this board.</text>
<text class="t xs"  x="1146" y="228">Free GPIO used: 1 × illumination LED.   No wire to the sensor node.</text>
<text class="t xs"  x="1146" y="248">Logs and uploads independently · 1 frame / 15 min · deep sleep between frames</text>
<text class="t xs"  x="1146" y="266">Focus is set BY HAND; drift is caught by a server-side sharpness alarm.</text>

</svg>
